@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0B0D10; --bg:#111418; --surface:#191D22; --sunk:#20252B; --line:#2B3139;
  --ink:#ECEFF2; --ink-2:#AEB6BF; --ink-3:#7F8994;

  --warn:#F2A54A; --warn-soft:#352612; color-scheme:dark }}
:root[data-theme="dark"]{
  --ground:#0B0D10; --bg:#111418; --surface:#191D22; --sunk:#20252B; --line:#2B3139;
  --ink:#ECEFF2; --ink-2:#AEB6BF; --ink-3:#7F8994;
  --red:#F0566A; --blue:#6A9EF2; --yellow:#F2C232; --green:#45C07A; --on-yellow:#1A1405;

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.app{max-width:480px;min-height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);

<script>
/*MATH-START*/
const KCAL_PER_KG = 7700;          // energy in ~1 kg of body fat
const LIVING_STEPS = 2500;         // steps already covered by the "daily living" multiplier
const MET = [
  {id:"weights", name:"Weight training", met:5.0},
  {id:"calis", name:"Calisthenics", met:4.5},
  {id:"hiit", name:"HIIT / circuit", met:8.0},
  {id:"run", name:"Running (moderate)", met:9.0},
  {id:"football", name:"Football", met:7.0},
  {id:"basketball", name:"Basketball", met:6.5},
  {id:"cycling", name:"Cycling", met:7.5},
  {id:"swim", name:"Swimming", met:6.0},
  {id:"skip", name:"Skipping rope", met:11.0},
  {id:"box", name:"Boxing", met:7.8},
  {id:"mma", name:"Martial arts / MMA", met:8.5},
  {id:"row", name:"Rowing machine", met:7.0},
  {id:"tennis", name:"Lawn tennis", met:7.3},
  {id:"padel", name:"Padel", met:6.5},
  {id:"squash", name:"Squash", met:7.3},
  {id:"badminton", name:"Badminton", met:5.5},
  {id:"tabletennis", name:"Table tennis", met:4.0},
  {id:"volleyball", name:"Volleyball", met:4.0},
  {id:"snooker", name:"Snooker / pool", met:2.5},
  {id:"stairs", name:"Stair climbing", met:8.8},
  {id:"dance", name:"Dancing", met:5.0},
  {id:"yoga", name:"Yoga / stretching", met:2.5},
  {id:"work", name:"Manual labour", met:4.0},
  {id:"chores", name:"Chores / housework", met:3.3},
  {id:"sauna", name:"Sauna / steam room", met:1.5}
];
function bmr(p){ // Mifflin-St Jeor, kcal/day at rest
  const base = 10*p.weight + 6.25*p.height - 5*p.age;
  return p.sex === "female" ? base - 161 : base + 5;
}
function strideM(p){ return p.height/100 * (p.sex === "female" ? 0.413 : 0.415); }
function kcalPerStep(p){ return 0.5 * p.weight * strideM(p) / 1000; } // net walking cost ≈0.5 kcal/kg/km
function stepKcal(p, steps){ return Math.max(0, (steps||0) - LIVING_STEPS) * kcalPerStep(p); }
function activityKcal(p, met, minutes){ return Math.max(0, met - 1) * p.weight * minutes / 60; } // net above resting
function floorKcal(p){ return p.sex === "female" ? 1200 : 1500; }
function proteinTarget(p){
  const bmi = p.weight / Math.pow(p.height/100, 2);
  const ref = bmi > 30 ? 25 * Math.pow(p.height/100, 2) : p.weight;
  return {min: Math.round(1.6*ref), max: Math.round(2.2*ref), ref: Math.round(ref), adjusted: bmi > 30};
}
function dayBurn(p, day, factor){
  const rest = bmr(p);
  const living = rest * 0.2;
  const steps = stepKcal(p, day.steps);
  const work = (day.activities||[]).reduce((s,a)=>s + a.kcal, 0);
  const f = factor || 1;
  return {rest: rest*f, living: living*f, steps: steps*f, work: work*f, total: (rest+living+steps+work)*f};
}
function dayTotals(day){
  return (day.foods||[]).reduce((t,f)=>({kcal:t.kcal+f.kcal, protein:t.protein+f.protein}), {kcal:0, protein:0});
}
// Adaptive estimate: compare predicted burn with what the scale actually did.
function adaptive(p, days, weights){
  const ws = [...weights].sort((a,b)=>a.date.localeCompare(b.date));
  if (ws.length < 4) return {ready:false, reason:"weights", have:ws.length};
  const t0 = Date.parse(ws[0].date);
  const xs = ws.map(w => (Date.parse(w.date)-t0)/864e5), ys = ws.map(w=>w.kg);
  const span = xs[xs.length-1];
  const logged = Object.entries(days).filter(([k,d]) => k >= ws[0].date && k <= ws[ws.length-1].date && (d.foods||[]).length);
  if (span < 14 || logged.length < 10) return {ready:false, reason:"span", span:Math.round(span), logged:logged.length};
  const mx = xs.reduce((a,b)=>a+b)/xs.length, my = ys.reduce((a,b)=>a+b)/ys.length;
  let num=0, den=0; xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my); den+=(x-mx)*(x-mx);});
  const slope = num/den;                        // kg per day
  const intake = logged.reduce((s,[,d])=>s+dayTotals(d).kcal,0)/logged.length;
  const formula = logged.reduce((s,[,d])=>s+dayBurn(p,d).total,0)/logged.length;
  const actual = intake - slope*KCAL_PER_KG;
  const factor = Math.min(1.2, Math.max(0.8, actual/formula));
  return {ready:true, slope, weekly:slope*7, intake, formula, actual, factor, logged:logged.length, span:Math.round(span)};
}
function nextSet(ex){ // double progression inside a rep range
  const reps = ex.reps.filter(n=>n>0);
  const inc = ex.kind === "lower" ? 5 : 2.5;
  if (!reps.length) return null;
  if (reps.every(r => r >= ex.hi)) return {weight: +(ex.weight+inc).toFixed(1), reps: ex.lo, why:`Every set hit ${ex.hi}. Add ${inc} kg and restart at ${ex.lo} reps.`};
  if (reps.some(r => r < ex.lo)) return {weight: ex.weight, reps: ex.lo, why:`Some sets fell below ${ex.lo}. Keep ${ex.weight} kg and own every set at ${ex.lo}+ before adding reps.`};
  const target = Math.min(ex.hi, Math.min(...reps)+1);
  return {weight: ex.weight, reps: target, why:`Same weight. Beat your weakest set: aim for ${target} reps on every set.`};
}
/*MATH-END*/

function aiError(e){
  const c = e && e.code;
  if (c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"){ sample=null; return "AI features aren't available in this view."; }
  if (c==="rate_limited") return "Too many requests right now. Try again in a minute.";
  if (c==="image_rejected") return "That photo couldn't be read. Try a JPEG or PNG under 20 MB.";
  if (c==="refused") return "That request couldn't be answered. Try rewording it.";
  if (c==="invalid_json") return "The estimate came back garbled. Tap to try again.";
  if (c==="cancelled") return "";
  return "Something went wrong reaching the AI. Try again.";
}

/* ---------- derived ---------- */
function numbers(k=cur){
  const p = S.profile, d = day(k);
  const ad = adaptive(p, S.days, S.weights);
  const burn = dayBurn(p, d, ad.ready ? ad.factor : 1);
  const eat = dayTotals(d);
  const goalDef = p.deficit;
  const rawTarget = burn.total - goalDef;
  const target = Math.max(floorKcal(p), rawTarget);
  return {p, d, ad, burn, eat, goalDef, target, floored: rawTarget < floorKcal(p), remaining: target - eat.kcal, deficit: burn.total - eat.kcal, prot: proteinTarget(p)};
}

/* ---------- render ---------- */
function render(){
  if (!S.profile){ renderOnboarding(); return; }
  $("#layer").innerHTML = $("#layer").querySelector(".scrim") ? $("#layer").innerHTML : "";
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  const dt = new Date(cur+"T12:00:00");
  const diff = Math.round((Date.parse(TODAY)-Date.parse(cur))/864e5);
  $("#dayLabel").textContent = diff===0 ? "Today" : diff===1 ? "Yesterday" : dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  $("#nextDay").disabled = cur >= TODAY;
  if (tab==="home") cur = TODAY;
  $(".daynav").hidden = !(tab==="today" || tab==="food" || tab==="checkin");
  ({home:renderHome, today:renderToday, compete:renderCompete, psych:renderPsych, food:renderFood, checkin:renderCheckin, learn:renderLearn, progress:renderProgress})[tab]();
}

function ringSVG(frac, color){
  const R=56, C=2*Math.PI*R, f=Math.max(0,Math.min(1,frac));
  return `<svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="12"/>
  <circle cx="66" cy="66" r="${R}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/></svg>`;
}

function burnRows(b){

function actMet(a){
  if (typeof a.met === "number") return a.met;

}

async function runEstimate(kind){
  if (kind==="photo" && !S.premium && (day().photoUses||0) >= FREE_PHOTO_PER_DAY){ aiMsg="You've used today's free scan — upgrade for unlimited."; renderFood(); return; }

    if (!items.length) throw {code:"invalid_json"};
    const est = {items, confidence:res.confidence, note:res.note, source: kind==="photo"?"photo estimate":"described"};

  const c = $("#chat"); c.lastElementChild && c.lastElementChild.scrollIntoView({block:"end"});

async function sendChat(){
  const box = $("#cin"), text = box.value.trim(); if (!text || !sample) return;
  const d = day(), n = numbers();
  d.chat.push({role:"user", content:text}); save();
  chatBusy = true; pending = []; renderCheckin();
  const rules = `You are the daily check-in coach in a fitness and nutrition app. Be warm, brief (2-4 sentences), practical, never shaming.
User: ${n.p.sex}, ${n.p.age} y, ${n.p.height} cm, ${n.p.weight} kg. Today so far: eaten ${r0(n.eat.kcal)} kcal, ${r0(n.eat.protein)} g protein (minimum ${n.prot.min} g), burn ${r0(n.burn.total)} kcal, deficit ${r0(n.deficit)} kcal (goal ${n.goalDef}). Steps ${d.steps}. Already logged workouts: ${d.activities.map(a=>a.name+" "+a.minutes+"min").join(", ")||"none"}.
Extract NEW exercise the user mentions (not walking; steps cover walking; not already logged) with a MET value from the Compendium of Physical Activities, and NEW food not yet logged with kcal and protein estimates.
Reply with only JSON: {"reply":string,"activities":[{"name":string,"minutes":number,"met":number}],"foods":[{"name":string,"kcal":number,"protein":number}]}`;
  const turns = [{role:"user", content:rules}, ...d.chat.slice(-12)];
  chatCtl = new AbortController();
  try{
    const res = await sample.json(turns, {cache:false, signal:chatCtl.signal});
    d.chat.push({role:"assistant", content:String(res.reply||"Got it.")});
    pending = [
      ...(res.activities||[]).filter(a=>+a.minutes>0).map(a=>({type:"act", name:String(a.name), minutes:r0(+a.minutes), kcal:r0(activityKcal(n.p, Math.min(16,Math.max(1,+a.met||4)), +a.minutes))})),
      ...(res.foods||[]).map(f=>({type:"food", name:String(f.name), kcal:r0(+f.kcal||0), protein:r0(+f.protein||0)}))
    ];
  }catch(e){
    const m = aiError(e); if (m) d.chat.push({role:"assistant", content:m});
  }
  chatBusy = false; save(); if (tab==="checkin") renderCheckin();
}

function weightChart(ws){
  if (ws.length < 2) return `<div class="empty">Log two or more weigh-ins to see your trend.</div>`;
  const W=440,H=180,L=34,R=10,T=12,B=26;
  const t0=Date.parse(ws[0].date), t1=Date.parse(ws[ws.length-1].date), span=Math.max(1,t1-t0);
  const kgs=ws.map(w=>w.kg); let lo=Math.floor(Math.min(...kgs)-0.5), hi=Math.ceil(Math.max(...kgs)+0.5);
  const x=t=>L+(t-t0)/span*(W-L-R), y=k=>T+(hi-k)/(hi-lo)*(H-T-B);
  const avg = ws.map((w,i)=>{const t=Date.parse(w.date); const win=ws.filter(v=>{const tv=Date.parse(v.date);return tv<=t&&tv>t-7*864e5}); return [t, win.reduce((s,v)=>s+v.kg,0)/win.length];});
  const step = (hi-lo)<=4?1:2; let grid="";
  for(let k=lo;k<=hi;k+=step) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(k)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--f-data)">${k}</text>`;
  const fmtD=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const line = avg.map(([t,k],i)=>`${i?"L":"M"}${x(t).toFixed(1)},${y(k).toFixed(1)}`).join("");
  const area = line+`L${x(avg[avg.length-1][0])},${H-B}L${x(avg[0][0])},${H-B}Z`;
  const lastA = avg[avg.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend from ${ws[0].kg} to ${ws[ws.length-1].kg} kg">${grid}
    <path d="${area}" fill="var(--blue)" opacity=".08"/>
    ${ws.map(w=>`<circle cx="${x(Date.parse(w.date))}" cy="${y(w.kg)}" r="3" fill="var(--ink-3)" opacity=".55"/>`).join("")}
    <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(lastA[0])}" cy="${y(lastA[1])}" r="5" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--ink-3)" font-family="var(--f-data)">${fmtD(t0)}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--f-data)">${fmtD(t1)}</text>
    <line id="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
    <rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>
    <div class="tip" id="tip" hidden></div>
    <div class="row small muted" style="margin-top:6px;gap:14px"><span class="row" style="gap:6px"><span class="dot" style="background:var(--ink-3);opacity:.55;width:8px;height:8px"></span>Weigh-in</span><span class="row" style="gap:6px"><span style="width:16px;height:2px;background:var(--blue)"></span>7-day average</span></div>`;
}
function bindChart(ws){
  const hit = document.getElementById("hit"); if (!hit) return;
  const svg = hit.ownerSVGElement, tip = $("#tip"), cross = document.getElementById("cross");
  const W=440,L=34,R=10, t0=Date.parse(ws[0].date), span=Math.max(1,Date.parse(ws[ws.length-1].date)-t0);
  const move = e => {
    const r = svg.getBoundingClientRect(), px = ((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*W;
    const t = t0+(px-L)/(W-L-R)*span;
    const w = ws.reduce((b,v)=>Math.abs(Date.parse(v.date)-t)<Math.abs(Date.parse(b.date)-t)?v:b);
    const cx = L+(Date.parse(w.date)-t0)/span*(W-L-R);
    cross.setAttribute("x1",cx); cross.setAttribute("x2",cx); cross.setAttribute("visibility","visible");
    tip.hidden=false; tip.textContent = `${new Date(w.date+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})} · ${w.kg.toFixed(1)} kg`;
    tip.style.left = (cx/W*r.width)+"px"; tip.style.top = "20px";
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", ()=>{tip.hidden=true; cross.setAttribute("visibility","hidden");});
}

    <div class="card-head"><h2>Gym challenge</h2><span class="pill ${S.social.gym.week>=S.social.rival.week?"green":"yellow"}">${S.social.gym.week>=S.social.rival.week?"Leading":"Behind"}</span></div>
    <div class="teamrow"><span class="av" style="background:var(--red)">${initials(S.social.gym.name)}</span><div class="tn"><div class="row between"><strong>${esc(S.social.gym.name)}</strong><span class="num small">${fmt(S.social.gym.week)}</span></div><div class="bar" style="margin-top:6px"><i style="width:${S.social.gym.week/maxT*100}%;background:var(--red)"></i></div></div></div>
    <div class="teamrow"><span class="av" style="background:var(--ink-3)">${initials(S.social.rival.name)}</span><div class="tn"><div class="row between"><strong>${esc(S.social.rival.name)}</strong><span class="num small">${fmt(S.social.rival.week)}</span></div><div class="bar" style="margin-top:6px"><i style="width:${S.social.rival.week/maxT*100}%;background:var(--ink-3)"></i></div></div></div>
    <p class="small muted">${S.social.gym.members} members vs ${S.social.rival.members}. You've added <strong class="num">${fmt(you.week)}</strong> steps to ${esc(S.social.gym.name)} this week.</p>
  </section>`;
}

/* ---------- onboarding & sheets ---------- */
function profileForm(p){
  p = p || {sex:"male", age:"", height:"", weight:"", deficit:500, stepGoal:8000};
  return `<div class="field"><span>Sex (the calorie formula differs)</span><div class="seg" role="group" id="sx"><button type="button" data-sex="male" aria-pressed="${p.sex==="male"}">Male</button><button type="button" data-sex="female" aria-pressed="${p.sex==="female"}">Female</button></div></div>
  <div class="grid2" style="grid-template-columns:repeat(3,1fr)">
    <label class="field"><span>Age</span><input type="number" id="pa" min="18" max="100" inputmode="numeric" value="${p.age}"></label>
    <label class="field"><span>Height (cm)</span><input type="number" id="ph" min="120" max="230" inputmode="numeric" value="${p.height}"></label>
    <label class="field"><span>Weight (kg)</span><input type="number" id="pw" min="35" max="300" step="0.1" inputmode="decimal" value="${p.weight}"></label>
  </div>
  <div class="field"><span>Daily deficit goal</span><div class="seg" role="group" id="dg">${[300,400,500].map(v=>`<button type="button" data-def="${v}" aria-pressed="${p.deficit===v}">${v} kcal</button>`).join("")}</div>
  <span class="small muted" style="font-weight:400">500 kcal a day is roughly 0.45 kg of fat a week. Capped at 500 to protect muscle and energy.</span></div>
  <label class="field"><span>Daily step goal</span><input type="number" id="ps" min="1000" step="500" inputmode="numeric" value="${p.stepGoal}"></label>
  <p id="perr" class="small" style="color:var(--red)" hidden></p>`;
}
function readProfile(){
  const sex = document.querySelector("[data-sex][aria-pressed=true]").dataset.sex;
  const deficit = +document.querySelector("[data-def][aria-pressed=true]").dataset.def;
  const age=+$("#pa").value, height=+$("#ph").value, weight=+$("#pw").value, stepGoal=+$("#ps").value||8000;
  const err = $("#perr");
  const fail = m => { err.textContent=m; err.hidden=false; return null; };
  if (!age||!height||!weight) return fail("Fill in age, height and weight.");
  if (age<18) return fail("This app is for adults 18 and over. Calorie deficits aren't recommended for teenagers without a doctor's guidance.");
  if (height<120||height>230||weight<35||weight>300) return fail("Check your height (cm) and weight (kg).");
  return {sex, age, height, weight, deficit, stepGoal};
}
function renderOnboarding(){
  $("#layer").innerHTML = `<div class="onb"><div class="onb-in">
    <div class="plates" aria-hidden="true"><i style="height:54px;background:var(--red)"></i><i style="height:48px;background:var(--blue)"></i><i style="height:40px;background:var(--yellow)"></i><i style="height:32px;background:var(--green)"></i></div>
    <h1>Enig<b>ma</b></h1>
    <p style="color:var(--ink-2);max-width:42ch">Train stronger, eat with a plan, and end each day in a deficit with your protein hit. Start with a few numbers so the app can work out your daily burn.</p>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">${profileForm()}
      <button class="btn red block" data-start>Calculate my targets</button></div>
    <button class="btn ghost" data-demo>Explore with sample data instead</button>
    <p class="small muted">Prototype. Data stays in this browser only.</p>
  </div></div>`;
}
function openQuickLog(id){
  const m = MET.find(x=>x.id===id); if(!m) return;
  const def = (S.favMin && S.favMin[id]) || QUICK_MIN;
  const presets = [15,20,30,45,60,90];
  $("#layer").innerHTML = `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Log ${esc(m.name)}">
    <div class="row between"><h3>${esc(m.name)}</h3><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="field"><span>Duration</span>
      <div class="row" id="qpresets" style="margin-bottom:8px">${presets.map(v=>`<button type="button" class="chipbtn" data-qpreset="${v}" aria-pressed="${v===def}">${v}m</button>`).join("")}</div>
      <input type="number" id="qmin" value="${def}" min="1" inputmode="numeric" aria-label="Minutes">
    </div>
    <p class="small muted" id="qprev"></p>
    <button class="btn red block" data-quick-log="${id}">Add to ${cur===TODAY?"today":"this day"}</button>
    <p class="small muted">Starts at your usual time — tap a preset or type any number. We'll remember it for next time.</p></div></div>`;
  const upd=()=>{ const mins=+$("#qmin").value||0; $("#qprev").textContent=`${mins} min · ≈ ${fmt(activityKcal(S.profile,m.met,mins))} kcal above resting`; document.querySelectorAll("#qpresets [data-qpreset]").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.qpreset===mins)); };
  $("#qmin").oninput=upd; upd();
}
function openActivity(){
  $("#layer").innerHTML = `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Add workout">
    <div class="row between"><h3>Add workout</h3><button class="x" data-close aria-label="Close">✕</button></div>
    <div id="amfavwrap"></div>
    <div class="field"><span>Activity</span><div class="row" style="flex-wrap:nowrap;gap:8px">
      <select id="am" style="flex:1;min-width:0">${MET.map(m=>`<option value="${m.id}">${m.name}</option>`).join("")}</select>
      <button type="button" id="amfav" aria-label="Save activity to favourites" style="width:44px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;flex:none;font-size:19px;line-height:1"></button>
    </div></div>
    <label class="field"><span>Minutes</span><input type="number" id="amin" value="45" min="1" inputmode="numeric"></label>
    <p class="small muted" id="aprev"></p>
    <button class="btn red block" data-add-act>Add to ${cur===TODAY?"today":"this day"}</button>
    <p class="small muted">Don't add walking here — your step count already covers it. Tap the star to save an activity to your favourites.</p></div></div>`;
  const favWrap = $("#amfavwrap"), favBtn = $("#amfav");
  function renderFavs(){
    const favs = (S.favActs||[]).map(id=>MET.find(m=>m.id===id)).filter(Boolean);
    favWrap.innerHTML = favs.length ? `<div class="field"><span>Your favourites</span><div class="row">${favs.map(m=>`<button type="button" class="chipbtn" data-fav-pick="${m.id}" style="color:var(--warn)">★ ${esc(m.name)}</button>`).join("")}</div></div>` : "";
  }
  function upd(){
    const id = $("#am").value, m = MET.find(x=>x.id===id);
    $("#aprev").textContent = `≈ ${fmt(activityKcal(S.profile,m.met,+$("#amin").value||0))} kcal above resting`;
    const isFav = (S.favActs||[]).includes(id);
    favBtn.textContent = isFav ? "★" : "☆";
    favBtn.style.color = isFav ? "var(--yellow)" : "var(--ink-3)";
    favBtn.setAttribute("aria-pressed", isFav);
  }
  favBtn.onclick = () => {
    const id = $("#am").value; S.favActs = S.favActs || [];
    const nowFav = !S.favActs.includes(id);
    S.favActs = nowFav ? [...S.favActs, id] : S.favActs.filter(x=>x!==id);
    save(); renderFavs(); upd(); toast(nowFav ? "Added to favourites" : "Removed from favourites");
  };
  favWrap.addEventListener("click", e => { const b = e.target.closest("[data-fav-pick]"); if (!b) return; $("#am").value = b.dataset.favPick; upd(); });
  $("#am").onchange = upd; $("#amin").oninput = upd;
  renderFavs(); upd();
}
function openSteps(){
  $("#layer").innerHTML = `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Set steps">
    <div class="row between"><h3>Steps</h3><button class="x" data-close aria-label="Close">✕</button></div>
    <label class="field"><span>Total steps for the day</span><input type="number" id="sv" value="${day().steps}" min="0" inputmode="numeric"></label>
    <button class="btn primary block" data-set-steps>Save</button></div></div>`;
}
function openProfile(){
  $("#layer").innerHTML = `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Edit profile">
    <div class="row between"><h3>Profile</h3><button class="x" data-close aria-label="Close">✕</button></div>
    ${profileForm(S.profile)}<button class="btn primary block" data-save-profile>Save</button></div></div>`;
}

function loadDemo(){
  const p = {sex:"male", age:28, height:178, weight:86, deficit:500, stepGoal:9000};
  const days = {}, weights = []; const now = new Date();
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for (let i=24;i>=1;i--){
    const d = new Date(now); d.setDate(d.getDate()-i); const k = key(d);
    const kcal = 2100 + r0((rnd()-0.5)*500), pr = 140 + r0((rnd()-0.5)*50);
    days[k] = {foods:[{id:uid(), name:"Meals logged", serving:"daily total", kcal, protein:pr, source:"sample"}], steps: 6000+r0(rnd()*6000), activities: i%2?[]:[{id:uid(),name:"Weight training",minutes:60,kcal:r0(activityKcal(p,5,60))}], chat:[]};
    if (i%2===0 || i===1) weights.push({date:k, kg:+(88.4 - (24-i)*0.07 + (rnd()-0.5)*0.7).toFixed(1)});
  }
  p.weight = weights[weights.length-1].kg;
  days[TODAY] = {foods:[
    {id:uid(), name:"Boiled eggs", serving:"2 large", kcal:140, protein:12, source:"search"},
    {id:uid(), name:"Agege bread", serving:"1/4 loaf", kcal:290, protein:9, source:"search"},
    {id:uid(), name:"Jollof rice with grilled chicken", serving:"1 plate", kcal:730, protein:52, source:"photo estimate"}
  ], steps:6400, activities:[{id:uid(), name:"Weight training", minutes:50, kcal:r0(activityKcal(p,5,50))}], chat:[]};
  S = {profile:p, days, weights, done:{train0:true, mind2:true}, ladders:{push:3,pull:2,legs:2,core:1}, lifts:[], favActs:["weights","box","football"], favSeeded:true, favMin:{weights:45, box:30, football:60}};
  save();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close]"); if (!t) return;
  const ds = t.dataset;
  if (ds.close !== undefined && (e.target === t || t.tagName==="BUTTON")) { $("#layer").innerHTML=""; return; }
  if (t.closest(".sheet") && t.classList.contains("scrim")) return;
  if (ds.tab){ tab = ds.tab; if (tab!=="checkin") pending=[]; window.scrollTo(0,0); render(); return; }
  if (t.id==="prevDay"){ const d=new Date(cur+"T12:00"); d.setDate(d.getDate()-1); cur=key(d); pending=[]; photoEst=descEst=null; render(); return; }
  if (t.id==="nextDay"){ const d=new Date(cur+"T12:00"); d.setDate(d.getDate()+1); cur=key(d)>TODAY?TODAY:key(d); pending=[]; photoEst=descEst=null; render(); return; }
  if (ds.sex){ t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===t)); return; }
  if (ds.def){ t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===t)); return; }
  if (ds.start !== undefined){ const p=readProfile(); if(!p) return; S.profile=p; S.weights=[{date:TODAY, kg:p.weight}]; save(); $("#layer").innerHTML=""; render(); return; }
  if (ds.demo !== undefined){ loadDemo(); $("#layer").innerHTML=""; render(); toast("Sample data loaded"); return; }
  if (ds.steps){ day().steps += +ds.steps; save(); render(); return; }
  if (ds.stepsSet !== undefined){ openSteps(); return; }
  if (ds.setSteps !== undefined){ day().steps = Math.max(0, r0(+$("#sv").value||0)); save(); $("#layer").innerHTML=""; render(); return; }
  if (ds.open==="act"){ openActivity(); return; }
  if (ds.burntab){ homeBurnTab = ds.burntab; renderHome(); return; }
  if (ds.xadd){ const m=MET.find(x=>x.id===ds.xadd); const inp=$("#xmin-"+ds.xadd); const mins=Math.max(1,r0(+(inp&&inp.value)||0)); if(!((inp&&inp.value)!=="" && mins>0)){ toast("Enter minutes first"); return; } day().activities.push({id:uid(), name:m.name, minutes:mins, kcal:r0(activityKcal(S.profile,m.met,mins)), met:m.met}); save(); renderHome(); toast(`${m.name} · ${mins} min · +${fmt(activityKcal(S.profile,m.met,mins))} kcal`); return; }
  if (ds.quickAct){ openQuickLog(ds.quickAct); return; }
  if (ds.qpreset){ const i=$("#qmin"); if(i){ i.value=ds.qpreset; i.dispatchEvent(new Event("input")); } return; }
  if (ds.quickLog){ const m=MET.find(x=>x.id===ds.quickLog); const mins=Math.max(1,r0(+$("#qmin").value||0)); if(!(mins>0)) return; day().activities.push({id:uid(), name:m.name, minutes:mins, kcal:r0(activityKcal(S.profile,m.met,mins))}); S.favMin=S.favMin||{}; S.favMin[ds.quickLog]=mins; save(); $("#layer").innerHTML=""; render(); toast(`${m.name} · ${mins} min · +${fmt(activityKcal(S.profile,m.met,mins))} kcal`); return; }
  if (ds.addAct !== undefined){ const m=MET.find(x=>x.id===$("#am").value), min=+$("#amin").value; if(!(min>0)) return; day().activities.push({id:uid(), name:m.name, minutes:r0(min), kcal:r0(activityKcal(S.profile,m.met,min))}); save(); $("#layer").innerHTML=""; render(); toast("Workout added"); return; }
  if (ds.delAct){ const d=day(); d.activities=d.activities.filter(a=>a.id!==ds.delAct); save(); render(); return; }
  if (ds.delFood){ const d=day(); d.foods=d.foods.filter(f=>f.id!==ds.delFood); save(); render(); return; }
  if (ds.fmode){ foodMode=ds.fmode; aiMsg=""; renderFood(); return; }
  if (ds.addDb){ const f=FOODS.find(x=>x.name===ds.addDb); day().foods.push({id:uid(), name:f.name, serving:f.serving, kcal:f.kcal, protein:f.protein, source:"search"}); save(); renderFood(); toast(`${f.name} added`); return; }
  if (ds.barcodeScan !== undefined){ const bc=$("#bc"); let prod; if(bc && bc.value.trim()) prod=BARCODE_FOODS.find(x=>x.code===bc.value.trim()); if(!prod) prod=BARCODE_FOODS[Math.floor(Math.random()*BARCODE_FOODS.length)]; scannedProduct=prod; renderFood(); return; }
  if (ds.addBarcode !== undefined){ if(!scannedProduct) return; const b=scannedProduct; day().foods.push({id:uid(), name:b.name, serving:b.serving, kcal:b.kcal, protein:b.protein, source:"barcode"}); scannedProduct=null; save(); renderFood(); toast(`${b.name} added`); return; }
  if (ds.addCustom !== undefined){ if(!S.premium && (day().customUses||0) >= FREE_CUSTOM_PER_DAY){ toast("Daily free manual limit reached"); renderFood(); return; } const n=$("#cn").value.trim(), k=+$("#ck").value, pr=+$("#cp").value||0; if(!n||!(k>=0)||$("#ck").value==="") { toast("Add a name and calories"); return; } const dd=day(); dd.foods.push({id:uid(), name:n, serving:"", kcal:r0(k), protein:r0(pr), source:"custom"}); dd.customUses=(dd.customUses||0)+1; save(); renderFood(); toast("Added"); return; }
  if (ds.estimate !== undefined){ runEstimate("photo"); return; }
  if (ds.describe !== undefined){ lastDesc=$("#dq").value; if(!lastDesc.trim()) return; runEstimate("describe"); return; }
  if (ds.addEst !== undefined){ const est=photoEst||descEst; if(!est) return; est.items.forEach(it=>day().foods.push({id:uid(), name:it.name, serving:`${it.portion}${it.mult!==1?` × ${it.mult}`:""}`, kcal:r0(it.kcal*it.mult), protein:r0(it.protein*it.mult), source:est.source})); save(); photoEst=descEst=null; photo=null; lastDesc=""; renderFood(); toast("Added to log"); return; }
  if (ds.send !== undefined){ sendChat(); return; }
  if (ds.sug){ const s=pending[+ds.sug]; const d=day(); if(s.type==="act") d.activities.push({id:uid(), name:s.name, minutes:s.minutes, kcal:s.kcal}); else d.foods.push({id:uid(), name:s.name, serving:"", kcal:s.kcal, protein:s.protein, source:"check-in"}); pending.splice(+ds.sug,1); save(); renderCheckin(); toast(`${s.name} added`); return; }
  if (ds.sugX){ pending.splice(+ds.sugX,1); renderCheckin(); return; }
  if (ds.learn){ learnTab=ds.learn; renderLearn(); return; }
  if (ds.unlockPremium !== undefined){ S.premium=true; save(); render(); toast("Enigma Premium unlocked"); return; }
  if (ds.lockPremium !== undefined){ S.premium=false; save(); render(); toast("Premium locked (demo)"); return; }
  if (ds.period){ compPeriod=ds.period; renderCompete(); return; }
  if (ds.cheer){ const f=S.social.friends.find(x=>x.id===ds.cheer); const lbl=ds.label==="Cheer"?"Cheered":"Nudged"; S.social.acted.map[ds.cheer]=lbl; save(); renderCompete(); toast(`${lbl} ${f.name}`); return; }
  if (ds.lesson){ openLesson(+ds.lesson); return; }
  if (ds.homeCk){ if(ds.homeCk==="mind" && !S.premium){ tab="psych"; render(); return; } learnTab=ds.homeCk; openLesson(+ds.homeI); return; }
  if (ds.complete){ const k=learnTab+ds.complete; S.done[k]=!S.done[k]; save(); $("#layer").innerHTML=""; render(); return; }
  if (ds.lad){ const L=LADDERS[ds.lad]; S.ladders[ds.lad]=Math.max(0,Math.min(L.steps.length-1,S.ladders[ds.lad]+ +ds.dir)); save(); renderLearn(); return; }
  if (ds.plan !== undefined){ const name=$("#lx").value.trim()||"Lift", w=+$("#lw").value, reps=$("#lr").value.split(/[ ,]+/).map(Number).filter(n=>n>0);
    if(!(w>=0)||!reps.length){ toast("Add the weight and your reps"); return; }
    const next=nextSet({weight:w, reps, kind:$("#lk").value, lo:8, hi:12}); S.lifts.push({name, next}); save(); renderLearn(); return; }
  if (ds.weigh !== undefined){ const kg=+$("#wkg").value; if(!(kg>=35&&kg<=300)){ toast("Enter a weight in kg"); return; } S.weights=S.weights.filter(w=>w.date!==TODAY); S.weights.push({date:TODAY, kg}); S.profile.weight=kg; save(); renderProgress(); toast("Weight logged"); return; }
  if (ds.editProfile !== undefined){ openProfile(); return; }
  if (ds.saveProfile !== undefined){ const p=readProfile(); if(!p) return; S.profile=p; save(); $("#layer").innerHTML=""; render(); toast("Profile saved"); return; }
  if (ds.reset !== undefined){ if (t.dataset.armed){ try{localStorage.removeItem(STORE);}catch(e){} S={profile:null, days:{}, weights:[], done:{}, ladders:{push:0,pull:0,legs:0,core:0}, lifts:[]}; tab="today"; cur=TODAY; render(); } else { t.dataset.armed="1"; t.textContent="Tap again to erase everything"; } return; }
});
document.addEventListener("input", e => {
  if (e.target.id==="fq") filterFoods(e.target.value);
  if (e.target.dataset.mult !== undefined){ const est=photoEst||descEst; est.items[+e.target.dataset.mult].mult=+e.target.value; const keep=lastDesc; renderFood(); if($("#dq")) $("#dq").value=keep; }
});
document.addEventListener("change", e => {
  if (e.target.id==="pf" && e.target.files[0]){ const f=e.target.files[0]; if(photo) URL.revokeObjectURL(photo.url); photo={file:f, url:URL.createObjectURL(f)}; photoEst=null; aiMsg=""; renderFood(); }
  if (e.target.dataset.xedit){ const a=day(TODAY).activities.find(x=>x.id===e.target.dataset.xedit); if(a){ const mins=Math.max(1,r0(+e.target.value||0)); a.minutes=mins; a.kcal=r0(activityKcal(S.profile, actMet(a), mins)); save(); renderHome(); } }
});
document.addEventListener("keydown", e => {
  if (e.target.id==="cin" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); }
  if (e.key==="Escape" && $("#layer .scrim")) $("#layer").innerHTML="";
});
render();
</script>
